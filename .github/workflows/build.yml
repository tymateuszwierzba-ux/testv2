name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build NeonText (MC 26.3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Build log summary
        if: always()
        run: |
          {
            echo '### Gradle build log (tail)'
            echo '```'
            tail -c 80000 build-log.txt 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report errors as annotations
        if: failure()
        run: |
          grep -nE "error:|FAILURE:|What went wrong|Caused by|Execution failed|Could not|error\]" build-log.txt \
            | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload mod jar
        uses: actions/upload-artifact@v5
        with:
          name: neontext
          path: build/libs/*.jar
          if-no-files-found: error
